name: Self-host macOS Updater

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref or tag to build; leave empty to build the workflow ref"
        required: false
        default: ""
      arch:
        description: "macOS architecture to publish update metadata for"
        required: true
        type: choice
        options:
          - arm64
          - x64
        default: arm64
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
      - "!v*-dirty*"

permissions:
  contents: write

concurrency:
  group: selfhost-macos-updater-${{ github.ref }}-${{ github.event.inputs.arch || 'arm64' }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish macOS update assets
    # Fork/self-host builds own their own GitHub release feed. The canonical
    # upstream still uses its separate Desktop release path for signed and
    # notarized macOS builds.
    if: github.repository_owner != 'multica-ai'
    runs-on: macos-latest
    env:
      SELFHOST_DESKTOP_ARCH: ${{ github.event.inputs.arch || 'arm64' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate macOS signing secrets
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail

          missing=()
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("${name}")
            fi
          done

          if ((${#missing[@]})); then
            echo "::error::Self-host macOS updater releases must be Developer ID signed and notarized so Squirrel.Mac can install downloaded updates. Configure these repository secrets before publishing: ${missing[*]}"
            exit 1
          fi

      - name: Prepare GitHub Release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            raw_version="${GITHUB_REF_NAME}"
          else
            stable_versions="$(
              {
                gh release list \
                  --limit 1000 \
                  --json tagName,isDraft,isPrerelease \
                  --jq '.[] | select(.isDraft == false and .isPrerelease == false and (.tagName | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))) | .tagName'
                git tag --list 'v[0-9]*.[0-9]*.[0-9]*'
              } \
                | sed -nE 's/^v([0-9]+)\.([0-9]+)\.([0-9]+)$/\1.\2.\3/p' \
                | sort -t. -k1,1n -k2,2n -k3,3n \
                | uniq
            )"
            latest_stable="$(tail -n 1 <<<"${stable_versions}")"
            if [[ -z "${latest_stable}" ]]; then
              raw_version="v0.1.0"
            else
              IFS=. read -r major minor patch <<<"${latest_stable}"
              raw_version="v${major}.${minor}.$((patch + 1))"
            fi
          fi

          version="${raw_version#v}"
          if [[ ! "${version}" =~ ^[0-9] ]]; then
            version="0.0.0-${version}"
          fi
          if [[ "${version}" == *dirty* ]]; then
            echo "::error::Refusing to publish update assets from a dirty worktree version: ${version}"
            exit 1
          fi

          release_tag="v${version}"
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            release_tag="${GITHUB_REF_NAME}"
          fi

          source_sha="$(git rev-parse HEAD)"
          release_title="${release_tag}"
          release_notes="Self-host macOS Desktop updater assets for ${release_tag} (${source_sha})."

          create_flags=(--draft)
          edit_flags=()
          if [[ "${version}" == *-* ]]; then
            create_flags+=(--prerelease --latest=false)
            edit_flags+=(--prerelease --latest=false)
          else
            edit_flags+=(--prerelease=false)
          fi

          if ! gh release view "${release_tag}" >/dev/null 2>&1; then
            create_args=(
              "${release_tag}"
              --target "${source_sha}" \
              --title "${release_title}" \
              --notes "${release_notes}"
            )
            if ((${#create_flags[@]})); then
              create_args+=("${create_flags[@]}")
            fi
            gh release create "${create_args[@]}"
          else
            gh release edit "${release_tag}" \
              --target "${source_sha}" \
              --title "${release_title}" \
              --notes "${release_notes}" \
              "${edit_flags[@]}"
          fi

          echo "tag=${release_tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Package and publish macOS update assets
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # electron-builder's GitHub publisher reads GITHUB_TOKEN.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The built app's app-update.yml must point to this fork, not the
          # upstream multica-ai/multica feed.
          MULTICA_DESKTOP_VERSION: ${{ steps.release.outputs.version }}
          MULTICA_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
          VITE_API_URL: ${{ vars.SELFHOST_DESKTOP_API_URL || secrets.SELFHOST_DESKTOP_API_URL || vars.VITE_API_URL || secrets.VITE_API_URL || '' }}
          VITE_WS_URL: ${{ vars.SELFHOST_DESKTOP_WS_URL || secrets.SELFHOST_DESKTOP_WS_URL || vars.VITE_WS_URL || secrets.VITE_WS_URL || '' }}
          VITE_APP_URL: ${{ vars.SELFHOST_DESKTOP_APP_URL || secrets.SELFHOST_DESKTOP_APP_URL || vars.VITE_APP_URL || secrets.VITE_APP_URL || '' }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${VITE_API_URL:-}" ]]; then
            echo "::error::SELFHOST_DESKTOP_API_URL or VITE_API_URL must be set so the packaged Desktop app does not fall back to the official API."
            exit 1
          fi

          echo "[package] Desktop runtime API → ${VITE_API_URL}"
          if [[ -n "${VITE_WS_URL:-}" ]]; then
            echo "[package] Desktop runtime WS → ${VITE_WS_URL}"
          fi
          if [[ -n "${VITE_APP_URL:-}" ]]; then
            echo "[package] Desktop runtime app → ${VITE_APP_URL}"
          fi

          node scripts/package.mjs --mac "--${SELFHOST_DESKTOP_ARCH}" --publish always

      - name: Verify updater release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          SELFHOST_DESKTOP_ARCH: ${{ env.SELFHOST_DESKTOP_ARCH }}
        shell: bash
        run: |
          set -euo pipefail

          asset_names="$(gh release view "${RELEASE_TAG}" --json assets --jq '.assets[].name')"
          echo "${asset_names}"
          zip_name="multica-desktop-${VERSION}-mac-${SELFHOST_DESKTOP_ARCH}.zip"
          grep -Fx "latest-mac.yml" <<<"${asset_names}" >/dev/null
          grep -E '\.dmg$' <<<"${asset_names}" >/dev/null
          grep -Fx "${zip_name}" <<<"${asset_names}" >/dev/null
          grep -E '\.blockmap$' <<<"${asset_names}" >/dev/null

          tmp_dir="$(mktemp -d)"
          gh release download "${RELEASE_TAG}" \
            --pattern latest-mac.yml \
            --pattern "${zip_name}" \
            --dir "${tmp_dir}" \
            --clobber
          grep -Fx "version: ${VERSION}" "${tmp_dir}/latest-mac.yml" >/dev/null

          ditto -x -k "${tmp_dir}/${zip_name}" "${tmp_dir}/app"
          app_path="${tmp_dir}/app/Multica.app"
          test -d "${app_path}"
          codesign --verify --deep --strict --verbose=2 "${app_path}"
          team_id="$(codesign -dv --verbose=4 "${app_path}" 2>&1 | sed -n 's/^TeamIdentifier=//p')"
          if [[ -z "${team_id}" || "${team_id}" == "not set" ]]; then
            echo "::error::${zip_name} is not Developer ID signed; TeamIdentifier=${team_id:-missing}"
            exit 1
          fi
          spctl -a -vv --type execute "${app_path}"

      - name: Publish verified GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          publish_args=("${RELEASE_TAG}" --draft=false)
          if [[ "${VERSION}" == *-* ]]; then
            publish_args+=(--prerelease --latest=false)
          else
            publish_args+=(--prerelease=false --latest)
          fi
          gh release edit "${publish_args[@]}"

          is_draft="$(gh release view "${RELEASE_TAG}" --json isDraft --jq '.isDraft')"
          if [[ "${is_draft}" != "false" ]]; then
            echo "::error::${RELEASE_TAG} is still a draft; electron-updater cannot see draft releases"
            exit 1
          fi
